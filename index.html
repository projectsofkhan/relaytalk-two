<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RelayTalk — Connect</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://relaytalk.vercel.app/">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/auth.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Welcome ═══════════ -->
  <template id="tpl-welcome">
    <section class="auth-view welcome-view">
      <div class="welcome-container">
        <header class="hero">
          <img src="/relay.png" alt="RelayTalk" class="hero-logo">
          <h1 class="title">RelayTalk</h1>
          <p class="subtitle">Fast, private messaging for real friends.</p>
        </header>
        <ul class="features">
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-search"></i></span>
            <div class="feature-text"><h3>Find Friends</h3><p>Connect with people you know.</p></div>
          </li>
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-comment-dots"></i></span>
            <div class="feature-text"><h3>Instant Chat</h3><p>Real-time messaging, no delays.</p></div>
          </li>
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-shield-halved"></i></span>
            <div class="feature-text"><h3>Private & Secure</h3><p>Your conversations stay yours.</p></div>
          </li>
        </ul>
        <div class="action-buttons">
          <button class="btn-primary" data-nav="/signup">Create Account</button>
          <button class="btn-secondary" data-nav="/login">Sign In</button>
        </div>
      </div>
    </section>
  </template>

  <!-- ═══════════ VIEW: Login ═══════════ -->
  <template id="tpl-login">
    <section class="auth-view login-view">
      <header class="simple-header">
        <a href="/" class="simple-logo" data-nav="/">
          <img src="/relay.png" alt="" class="simple-logo-img"><span>RelayTalk</span>
        </a>
      </header>
      <main class="auth-container">
        <div class="auth-header">
          <div class="auth-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to continue.</p>
        </div>
        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginUsername">Username</label>
            <input type="text" id="loginUsername" class="form-input" placeholder="Enter your username" required>
            <div class="error-message" id="usernameError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required>
              <button type="button" class="password-toggle" id="passwordToggle" data-action="toggle-password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>
          <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;" id="loginBtn">Sign In</button>
        </form>
        <div class="success-message" id="successMessage"></div>
        <p class="auth-footer" style="text-align:center; margin-top:24px; color:var(--text-2);">New here? <a href="#" data-nav="/signup" style="color:var(--primary); font-weight:600;">Create an account</a></p>
      </main>
    </section>
  </template>

  <!-- ═══════════ VIEW: Signup ═══════════ -->
  <template id="tpl-signup">
    <section class="auth-view signup-view">
      <header class="simple-header">
        <a href="/" class="simple-logo" data-nav="/">
          <img src="/relay.png" alt="" class="simple-logo-img"><span>RelayTalk</span>
        </a>
      </header>
      <main class="auth-container">
        <div class="auth-header">
          <h1 class="auth-title">Create Account</h1>
          <p class="auth-subtitle">Join RelayTalk for free.</p>
        </div>
        <form class="auth-form" id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input" placeholder="Choose a username" required>
            <div class="error-message" id="usernameError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required>
              <button type="button" class="password-toggle" data-action="toggle-password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" class="form-input" placeholder="Re-enter password" required>
            <div class="error-message" id="confirmError"></div>
          </div>
          <button type="submit" class="btn-primary" style="width:100%; margin-top:8px;" id="submitBtn">Create Account</button>
        </form>
        <div class="success-container" id="successContainer" style="display:none;"></div>
        <p class="auth-footer" style="text-align:center; margin-top:24px; color:var(--text-2);">Already have an account? <a href="#" data-nav="/login" style="color:var(--primary); font-weight:600;">Sign In</a></p>
      </main>
    </section>
  </template>

  <script type="module" src="/auth.js"></script>
</body>
</html>
