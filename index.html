            <details class="landing-faq-item">

  <!-- ═══════════ VIEW: Login ═══════════ -->
  <template id="tpl-login">
    <section class="auth-view login-view">
      <header class="auth-topbar">
        <button type="button" class="back-btn" data-nav="/" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </button>
      </header>

      <main class="auth-main">
        <header class="auth-header">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to continue.</p>
        </header>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginUsername">Username</label>
            <input type="text" id="loginUsername" class="form-input"
                   placeholder="Enter your username" required
                   minlength="3" maxlength="20" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input">
              <input type="password" id="loginPassword" class="form-input"
                     placeholder="Enter your password" required minlength="6"
                     autocomplete="current-password">
              <button type="button" class="password-toggle" id="passwordToggle"
                      data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <button type="submit" class="btn-primary btn-block auth-btn" id="loginBtn">
            Sign in
          </button>
        </form>

        <div class="success-message" id="successMessage"></div>

        <p class="auth-footer">
          New to RelayTalk? <a href="#" data-nav="/signup">Create an account</a>
        </p>
      </main>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="login-loader"></div>
        <p class="loading-text">Signing you in…</p>
      </div>
    </section>
  </template>

  <!-- ═══════════ VIEW: Signup ═══════════ -->
  <template id="tpl-signup">
    <section class="auth-view signup-view">
      <header class="auth-topbar">
        <button type="button" class="back-btn" data-nav="/" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>Back</span>
        </button>
      </header>

      <main class="auth-main">
        <header class="auth-header">
          <h1 class="auth-title">Create your account</h1>
          <p class="auth-subtitle">Free forever. No email needed.</p>
        </header>

        <form class="auth-form" id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input"
                   placeholder="Choose a username" required
                   minlength="3" maxlength="20" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" class="form-input"
                     placeholder="At least 6 characters" required minlength="6"
                     autocomplete="new-password">
              <button type="button" class="password-toggle"
                      data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" class="form-input"
                   placeholder="Re-enter your password" required autocomplete="new-password">
            <div class="error-message" id="confirmError"></div>
          </div>

          <div class="terms-group">
            <div class="terms-row">
              <input type="checkbox" id="terms" required class="terms-check">
              <label for="terms" class="terms-text">I agree to the</label>
              <button type="button" class="terms-link" data-action="show-terms">Terms</button>
              <span class="terms-and">and</span>
              <button type="button" class="terms-link" data-action="show-privacy">Privacy Policy</button>
            </div>
            <div class="error-message" id="termsError"></div>
          </div>

          <button type="submit" class="btn-primary btn-block auth-btn" id="submitBtn">
            Create account
          </button>
        </form>

        <div class="success-container" id="successContainer" style="display:none;"></div>

        <p class="auth-footer">
          Already have an account? <a href="#" data-nav="/login">Sign in</a>
        </p>
      </main>

            <div class="modal-block">
              <h3>RelayTalk Org's promise</h3>

          </div>
          <footer class="modal-footer">

  <script>
    (function () {
      var boundFlag = 'data-landing-bound';

      function bindLanding(root) {
        if (!root || root.hasAttribute(boundFlag)) return;
        root.setAttribute(boundFlag, '1');

        root.querySelectorAll('[data-scroll]').forEach(function (btn) {
          btn.addEventListener('click', function (e) {
            e.preventDefault();
            var id = btn.getAttribute('data-scroll');
            var target = root.querySelector('#' + id);
            if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          });
        });

        var revealEls = root.querySelectorAll('[data-reveal]');
        if (!revealEls.length) return;

        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMotion || !('IntersectionObserver' in window)) {
          revealEls.forEach(function (el) { el.classList.add('in-view'); });
          return;
        }

        var observer = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add('in-view');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.05, rootMargin: '0px 0px -5% 0px' });

        revealEls.forEach(function (el) { observer.observe(el); });
      }

      var outlet = document.getElementById('view-outlet');
      if (!outlet) return;

      new MutationObserver(function () {
        var welcome = outlet.querySelector('.welcome-view');
        if (welcome) bindLanding(welcome);
      }).observe(outlet, { childList: true });

      var existing = outlet.querySelector('.welcome-view');
      if (existing) bindLanding(existing);
    })();
  </script>
</body>
</html>
