<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RelayTalk — Connect with friends instantly</title>
  <meta name="description" content="RelayTalk — Connect with friends instantly. Fast, private, and simple messaging.">
  <meta name="theme-color" content="#007acc">

  <link rel="canonical" href="https://relaytalk.vercel.app/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RelayTalk">
  <meta property="og:title" content="RelayTalk — Connect with friends instantly">
  <meta property="og:description" content="Fast, private, and simple messaging — made for real conversations.">
  <meta property="og:url" content="https://relaytalk.vercel.app/">
  <meta property="og:image" content="https://relaytalk.vercel.app/relayad.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@RelayTalk">
  <meta name="twitter:title" content="RelayTalk — Connect with friends instantly">
  <meta name="twitter:description" content="Fast, private, and simple messaging — made for real conversations.">
  <meta name="twitter:image" content="https://relaytalk.vercel.app/relayad.png?v=2">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/auth.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Welcome ═══════════ -->
  <template id="tpl-welcome">
    <section class="auth-view welcome-view">
      <div class="welcome-container">

        <header class="hero">
          <img src="/relay.png" alt="RelayTalk" class="hero-logo">
          <h1 class="title">RelayTalk</h1>
          <p class="subtitle">Connect with friends instantly</p>
        </header>

        <ul class="features" role="list">
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-search"></i></span>
            <div class="feature-text">
              <h3>Search Friends</h3>
              <p>Find and connect with friends</p>
            </div>
          </li>
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-bell"></i></span>
            <div class="feature-text">
              <h3>Notifications</h3>
              <p>Stay updated with messages</p>
            </div>
          </li>
          <li class="feature-card">
            <span class="feature-icon"><i class="fas fa-comment-dots"></i></span>
            <div class="feature-text">
              <h3>Instant Chat</h3>
              <p>Real-time messaging</p>
            </div>
          </li>
        </ul>

        <div class="action-buttons">
          <button class="btn-primary" data-nav="/signup">Create Account</button>
          <button class="btn-secondary" data-nav="/login">Login</button>
        </div>

        <footer class="welcome-footer">
          <p class="footer-hint">For Details, Features, And Help click below link</p>
          <a href="/about/" class="footer-cta">
            <span>Full Details About Relaytalk</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round" stroke-linejoin="round" width="15" height="15" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
          </a>
          <p class="footer-note">
            RelayTalk is a fast, private way to stay close to the people who matter —
            simple, secure, and made for real conversations.
          </p>
        </footer>

      </div>
    </section>
  </template>

  <!-- ═══════════ VIEW: Login ═══════════ -->
  <template id="tpl-login">
    <section class="auth-view login-view">

      <header class="simple-header">
        <a href="/" class="simple-logo" data-nav="/">
          <img src="/relay.png" alt="RelayTalk" class="simple-logo-img">
          <span>RelayTalk</span>
        </a>
      </header>

      <main class="auth-container auth-container--narrow">

        <div class="auth-header">
          <div class="auth-logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to your RelayTalk account</p>
        </div>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginUsername">
              <span class="form-label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              Username
            </label>
            <input type="text" id="loginUsername" class="form-input"
                   placeholder="Enter your username" required
                   minlength="3" maxlength="20"
                   name="username" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">
              <span class="form-label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              Password
            </label>
            <div class="password-input">
              <input type="password" id="loginPassword" class="form-input"
                     placeholder="Enter your password" required
                     minlength="6"
                     name="password" autocomplete="current-password">
              <button type="button" class="password-toggle" id="passwordToggle"
                      data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="login-options">
            <div class="remember-me">
              <input type="checkbox" id="rememberMe" name="remember">
              <label for="rememberMe">Remember me</label>
            </div>
          </div>

          <button type="submit" class="auth-btn" id="loginBtn">
            Sign In
          </button>
        </form>

        <div class="success-message" id="successMessage"></div>

        <div class="divider">or</div>

        <div class="signup-link">
          Don't have a RelayTalk account?
          <a href="#" data-nav="/signup">Create Free Account</a>
        </div>

        <div class="security-badges">
          <div class="badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            Private
          </div>
          <div class="badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            Secure
          </div>
          <div class="badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            Instant
          </div>
        </div>
      </main>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="login-loader"></div>
        <p class="loading-text">Signing you in…</p>
      </div>

    </section>
  </template>

  <!-- ═══════════ VIEW: Signup ═══════════ -->
  <template id="tpl-signup">
    <section class="auth-view signup-view">

      <header class="simple-header">
        <a href="/" class="simple-logo" data-nav="/">
          <img src="/relay.png" alt="RelayTalk" class="simple-logo-img">
          <span>RelayTalk</span>
        </a>
      </header>

      <div class="auth-container">
        <div class="auth-header">
          <div class="auth-logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <line x1="19" y1="8" x2="19" y2="14"/>
              <line x1="22" y1="11" x2="16" y2="11"/>
            </svg>
          </div>
          <h1 class="auth-title">Join RelayTalk</h1>
          <p class="auth-subtitle">Create your account to connect with friends</p>
        </div>

        <form class="auth-form" id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">
              <span class="form-label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              Username
            </label>
            <input type="text" id="username" class="form-input"
                   placeholder="e.g., alex_john" required
                   minlength="3" maxlength="20" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">
              <span class="form-label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              Password
            </label>
            <div class="password-input">
              <input type="password" id="password" class="form-input"
                     placeholder="Create a strong password" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle" data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">
              <span class="form-label-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                  <polyline points="22 4 12 14.01 9 11.01"/>
                </svg>
              </span>
              Confirm Password
            </label>
            <input type="password" id="confirmPassword" class="form-input"
                   placeholder="Re-enter your password" required autocomplete="new-password">
            <div class="error-message" id="confirmError"></div>
          </div>

          <div class="terms-container">
            <div class="terms-checkbox">
              <input type="checkbox" id="terms" required>
              <label for="terms">
                I agree to the Terms &amp; Conditions and Privacy Policy
              </label>
            </div>
            <div class="error-message" id="termsError"></div>

            <div class="terms-buttons">
              <button type="button" class="terms-btn" data-action="show-terms">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                  <line x1="16" y1="13" x2="8" y2="13"/>
                  <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                Terms &amp; Conditions
              </button>
              <button type="button" class="terms-btn" data-action="show-privacy">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <polyline points="9 12 11 14 15 10"/>
                </svg>
                Privacy Policy
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary auth-btn" id="submitBtn">
            Create Account
          </button>
        </form>

        <div class="success-container" id="successContainer" style="display:none;"></div>
      </div>

      <!-- Terms Modal -->
      <div class="modal-overlay" id="termsModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">
              <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
              </svg>
              Terms &amp; Conditions
            </h2>
            <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
          </div>
          <div class="modal-body">
            <h3>Welcome to RelayTalk</h3>
            <p>By creating an account, you agree to these simple terms:</p>

            <h3>Your Account</h3>
            <ul>
              <li>You must be at least 13 years old to use RelayTalk</li>
              <li>Your username must be unique and appropriate</li>
              <li>You are responsible for keeping your password secure</li>
            </ul>

            <h3>Messaging Rules</h3>
            <ul>
              <li>Be respectful to all users</li>
              <li>No harassment, bullying, or hate speech</li>
              <li>No spam or unsolicited messages</li>
              <li>Respect others' privacy</li>
            </ul>

            <div class="security-note">
              <strong>Important Security Notice:</strong>
              <p>Your password cannot be recovered if forgotten. We don't store passwords in a way that allows recovery. Please write it down securely.</p>
            </div>

            <h3>RelayTalk's Promise</h3>
            <p>We provide a secure, simple messaging platform for everyone to connect safely.</p>

            <p><em>Last updated: December 2024 | App Version: 1.0</em></p>
          </div>
        </div>
      </div>

      <!-- Privacy Modal -->
      <div class="modal-overlay" id="privacyModal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title">
              <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" aria-hidden="true">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              </svg>
              Privacy Policy
            </h2>
            <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
          </div>
          <div class="modal-body">
            <h3>Your Privacy Matters</h3>
            <p>At RelayTalk, we believe in simple, transparent privacy.</p>

            <h3>What We Store</h3>
            <ul>
              <li><strong>Username:</strong> Your chosen display name</li>
              <li><strong>Profile Information:</strong> Basic account details</li>
              <li><strong>Messages:</strong> Only between you and recipients</li>
            </ul>

            <h3>What We Don't Store</h3>
            <ul>
              <li>Email addresses</li>
              <li>Phone numbers</li>
              <li>Location data</li>
              <li>Contact lists</li>
            </ul>

            <h3>Your Data is Yours</h3>
            <ul>
              <li>Messages are stored only as long as needed</li>
              <li>We don't sell your data to anyone</li>
              <li>We don't show ads</li>
              <li>All data is encrypted and secured in the cloud</li>
            </ul>

            <div class="security-note">
              <strong>Security First:</strong>
              <p>RelayTalk is built with security in mind. Created by RelayChat to provide safe, private messaging for everyone.</p>
            </div>

            <h3>Contact</h3>
            <p>Questions? We're here to help make RelayTalk safe for you.</p>

            <p><em>Privacy is not a feature — it's our foundation.</em></p>
          </div>
        </div>
      </div>

    </section>
  </template>

  <script type="module" src="/auth.js"></script>
</body>
</html>
