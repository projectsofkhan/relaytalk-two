<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RelayTalk — Fast, private messaging</title>
  <meta name="description" content="RelayTalk — Fast, private, simple messaging for real conversations.">
  <meta name="theme-color" content="#ffffff">

  <link rel="canonical" href="https://relaytalk.vercel.app/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="RelayTalk">
  <meta property="og:title" content="RelayTalk — Fast, private messaging">
  <meta property="og:description" content="Fast, private, simple messaging — made for real conversations.">
  <meta property="og:url" content="https://relaytalk.vercel.app/">
  <meta property="og:image" content="https://relaytalk.vercel.app/relayad.png?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:site" content="@RelayTalk">
  <meta name="twitter:title" content="RelayTalk — Fast, private messaging">
  <meta name="twitter:description" content="Fast, private, simple messaging — made for real conversations.">
  <meta name="twitter:image" content="https://relaytalk.vercel.app/relayad.png?v=2">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/auth.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Welcome ═══════════ -->
  <template id="tpl-welcome">
    <section class="auth-view welcome-view">
      <div class="welcome-container">
        <img src="/relay.png" alt="" class="welcome-logo">
        <h1 class="welcome-title">RelayTalk</h1>
        <p class="welcome-tagline">Fast, private, simple messaging.</p>

        <div class="welcome-actions">
          <button class="btn-primary btn-block" data-nav="/signup">Get started</button>
          <button class="btn-secondary btn-block" data-nav="/login">Sign in</button>
        </div>

        <a href="/about/" class="welcome-learn">Learn more →</a>
      </div>
    </section>
  </template>

  <!-- ═══════════ VIEW: Login ═══════════ -->
  <template id="tpl-login">
    <section class="auth-view login-view">
      <header class="auth-topbar">
        <a href="/" class="auth-home" data-nav="/" aria-label="RelayTalk home">
          <img src="/relay.png" alt="" class="auth-home-logo">
        </a>
      </header>

      <main class="auth-container auth-container--narrow">
        <header class="auth-header">
          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Sign in to continue.</p>
        </header>

        <form class="auth-form" id="loginForm">
          <div class="form-group">
            <label class="form-label" for="loginUsername">Username</label>
            <input type="text" id="loginUsername" class="form-input"
                   placeholder="Enter your username" required
                   minlength="3" maxlength="20" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-input">
              <input type="password" id="loginPassword" class="form-input"
                     placeholder="Enter your password" required minlength="6"
                     autocomplete="current-password">
              <button type="button" class="password-toggle" id="passwordToggle"
                      data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <button type="submit" class="btn-primary btn-block auth-btn" id="loginBtn">
            Sign in
          </button>
        </form>

        <div class="success-message" id="successMessage"></div>

        <p class="auth-footer">
          New to RelayTalk? <a href="#" data-nav="/signup">Create an account</a>
        </p>
      </main>

      <div class="loading-overlay" id="loadingOverlay">
        <div class="login-loader"></div>
        <p class="loading-text">Signing you in…</p>
      </div>
    </section>
  </template>

  <!-- ═══════════ VIEW: Signup ═══════════ -->
  <template id="tpl-signup">
    <section class="auth-view signup-view">
      <header class="auth-topbar">
        <a href="/" class="auth-home" data-nav="/" aria-label="RelayTalk home">
          <img src="/relay.png" alt="" class="auth-home-logo">
        </a>
      </header>

      <main class="auth-container">
        <header class="auth-header">
          <h1 class="auth-title">Create your account</h1>
          <p class="auth-subtitle">It only takes a moment.</p>
        </header>

        <form class="auth-form" id="signupForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="username">Username</label>
            <input type="text" id="username" class="form-input"
                   placeholder="Choose a username" required
                   minlength="3" maxlength="20" autocomplete="username">
            <div class="error-message" id="usernameError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="password-input">
              <input type="password" id="password" class="form-input"
                     placeholder="At least 6 characters" required minlength="6"
                     autocomplete="new-password">
              <button type="button" class="password-toggle"
                      data-action="toggle-password" aria-label="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <div class="error-message" id="passwordError"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input type="password" id="confirmPassword" class="form-input"
                   placeholder="Re-enter your password" required autocomplete="new-password">
            <div class="error-message" id="confirmError"></div>
          </div>

          <div class="terms-group">
            <label class="checkbox-label">
              <input type="checkbox" id="terms" required>
              <span>I agree to the Terms &amp; Privacy Policy</span>
            </label>
            <div class="terms-actions">
              <button type="button" class="link-btn" data-action="show-terms">Read Terms</button>
              <button type="button" class="link-btn" data-action="show-privacy">Read Privacy</button>
            </div>
            <div class="error-message" id="termsError"></div>
          </div>

          <button type="submit" class="btn-primary btn-block auth-btn" id="submitBtn">
            Create account
          </button>
        </form>

        <div class="success-container" id="successContainer" style="display:none;"></div>

        <p class="auth-footer">
          Already have an account? <a href="#" data-nav="/login">Sign in</a>
        </p>
      </main>

      <!-- Terms Modal -->
      <div class="modal-overlay" id="termsModal">
        <div class="modal-content">
          <header class="modal-header">
            <h2 class="modal-title">Terms &amp; Conditions</h2>
            <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
          </header>
          <div class="modal-body">
            <h3>Welcome to RelayTalk</h3>
            <p>By creating an account, you agree to these simple terms:</p>

            <h3>Your account</h3>
            <ul>
              <li>You must be at least 13 years old to use RelayTalk</li>
              <li>Your username must be unique and appropriate</li>
              <li>You are responsible for keeping your password secure</li>
            </ul>

            <h3>Messaging rules</h3>
            <ul>
              <li>Be respectful to all users</li>
              <li>No harassment, bullying, or hate speech</li>
              <li>No spam or unsolicited messages</li>
              <li>Respect others' privacy</li>
            </ul>

            <div class="security-note">
              <strong>Important Security Notice</strong>
              <p>Your password cannot be recovered if forgotten. We don't store passwords in a way that allows recovery. Please write it down securely.</p>
            </div>

            <h3>RelayTalk's promise</h3>
            <p>We provide a secure, simple messaging platform for everyone to connect safely.</p>

            <p class="modal-meta">Last updated: December 2024 · App Version 1.0</p>
          </div>
        </div>
      </div>

      <!-- Privacy Modal -->
      <div class="modal-overlay" id="privacyModal">
        <div class="modal-content">
          <header class="modal-header">
            <h2 class="modal-title">Privacy Policy</h2>
            <button class="modal-close" data-action="close-modal" aria-label="Close">×</button>
          </header>
          <div class="modal-body">
            <h3>Your privacy matters</h3>
            <p>At RelayTalk, we believe in simple, transparent privacy.</p>

            <h3>What we store</h3>
            <ul>
              <li><strong>Username:</strong> your chosen display name</li>
              <li><strong>Profile information:</strong> basic account details</li>
              <li><strong>Messages:</strong> only between you and recipients</li>
            </ul>

            <h3>What we don't store</h3>
            <ul>
              <li>Email addresses</li>
              <li>Phone numbers</li>
              <li>Location data</li>
              <li>Contact lists</li>
            </ul>

            <h3>Your data is yours</h3>
            <ul>
              <li>Messages are stored only as long as needed</li>
              <li>We don't sell your data to anyone</li>
              <li>We don't show ads</li>
              <li>All data is encrypted and secured in the cloud</li>
            </ul>

            <div class="security-note">
              <strong>Security first</strong>
              <p>RelayTalk is built with security in mind. Created by RelayChat to provide safe, private messaging for everyone.</p>
            </div>

            <p class="modal-meta">Privacy is not a feature — it's our foundation.</p>
          </div>
        </div>
      </div>

    </section>
  </template>

  <script type="module" src="/auth.js"></script>
</body>
</html>
