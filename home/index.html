<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/home.css">
  <link rel="stylesheet" href="/shared/styles/chats.css">
  <link rel="stylesheet" href="/shared/styles/profile.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Dashboard ═══════════ -->
  <template id="tpl-dashboard">
    <div class="dashboard-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>

      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">RelayTalk</div>
          <div class="app-actions">
            <button id="btn-search"><i class="fas fa-search"></i></button>
            <button id="btn-notifs"><i class="fas fa-bell"></i></button>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div class="greeting-wrap">
          <h1 class="greeting-text" id="welcomeTitle">Hello.</h1>
          <p class="greeting-sub">Welcome back to RelayTalk.</p>
        </div>

        <button class="btn btn-primary" id="btn-find-friends" style="margin-bottom: 32px;">
          <i class="fas fa-user-plus" style="margin-right: 8px;"></i> Find Friends
        </button>

        <div class="section-header">
          <h2 class="section-title">Friends</h2>
          <button class="text-btn" id="btn-view-all-friends">View All</button>
        </div>
        
        <div class="flat-list" id="friendsList"></div>
      </main>

      <nav class="bottom-nav">
        <div class="nav-item active" data-nav="/"><i class="fas fa-comment"></i><span>Chats</span></div>
        <div class="nav-item" data-nav="/friends"><i class="fas fa-user-friends"></i><span>Friends</span></div>
        <div class="nav-item" data-nav="/profile"><i class="fas fa-user"></i><span>Profile</span></div>
      </nav>

      <!-- Search Modal -->
      <div class="modal-overlay" id="searchModal">
        <div class="modal-panel">
          <div class="modal-header"><h2 class="modal-title">Find People</h2><button class="modal-close" id="close-search">×</button></div>
          <div class="input-group"><i class="fas fa-search"></i><input type="text" id="searchInput" class="input-field" placeholder="Search by username"></div>
          <div id="searchResults"></div>
        </div>
      </div>

      <!-- Notifications Modal -->
      <div class="modal-overlay" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-header"><h2 class="modal-title">Notifications</h2><button class="modal-close" id="close-notifs">×</button></div>
          <div class="tabs">
            <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">Requests <span id="mainTabBadge" style="color:var(--danger);display:none;">0</span></button>
            <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">Calls <span id="callsTabBadge" style="color:var(--danger);display:none;">0</span></button>
          </div>
          <div class="tab-content active" id="notifMainContent"><div id="notificationsList"></div></div>
          <div class="tab-content" id="notifCallsContent"><div id="callHistoryList"></div></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Friends ═══════════ -->
  <template id="tpl-friends">
    <div class="friends-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">Friends</div>
        </div>
      </header>
      <main class="page-container">
        <div class="input-group" style="margin-top: 16px;">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" class="input-field" placeholder="Search friends..." oninput="searchFriends()">
        </div>
        <div class="flat-list" id="friendsList"></div>
      </main>
      <nav class="bottom-nav">
        <div class="nav-item" data-nav="/"><i class="fas fa-comment"></i><span>Chats</span></div>
        <div class="nav-item active" data-nav="/friends"><i class="fas fa-user-friends"></i><span>Friends</span></div>
        <div class="nav-item" data-nav="/profile"><i class="fas fa-user"></i><span>Profile</span></div>
      </nav>
    </div>
  </template>

  <!-- ═══════════ VIEW: Chats ═══════════ -->
  <template id="tpl-chats">
    <div class="chat-page">
      <header class="chat-header">
        <div class="chat-back" id="btn-back"><i class="fas fa-chevron-left"></i></div>
        <div class="chat-header-avatar" id="chatUserAvatar">U</div>
        <div class="chat-header-info" id="chatHeaderProfile">
          <div class="chat-header-name" id="chatUserName">User</div>
          <div class="chat-header-status" id="statusText">Offline</div>
        </div>
        <div class="chat-header-actions">
          <i class="fas fa-phone" id="btn-call"></i>
        </div>
      </header>

      <main class="chat-feed" id="messagesContainer">
        <div class="empty-chat">
          <svg class="empty-chat-icon" viewBox="0 0 24 24"><path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4A2,2 0 0,0 20,2Z"/></svg>
          <h3>Start the conversation</h3>
          <p>Say hello to your friend!</p>
        </div>
      </main>

      <div class="chat-input-bar">
        <i class="fas fa-paperclip chat-icon-btn" id="attachBtn"></i>
        <i class="fas fa-microphone chat-icon-btn" id="micBtn"></i>
        <div class="chat-input-wrapper">
          <textarea class="chat-input-field" id="messageInput" placeholder="Message..." rows="1"></textarea>
        </div>
        <button class="chat-send-btn" id="sendBtn" disabled><i class="fas fa-paper-plane"></i></button>
      </div>

      <!-- CHAT OVERLAYS (RESTORED FULLY) -->
      <div class="modal-overlay" id="userInfoModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">User Info</h3><button class="modal-close" id="close-userinfo">×</button></div><div class="modal-body" id="userInfoContent"></div></div></div>
      <div class="modal-overlay" id="guideModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Chat Guide</h3><button class="modal-close" id="close-guide">×</button></div><div class="modal-body" id="guideBody"></div></div></div>
      <div class="modal-overlay" id="customAlert"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title" id="alertTitle">Alert</h3><button class="modal-close" id="close-alert">×</button></div><div style="text-align:center;padding:24px;"><div id="alertIcon" style="font-size:48px;margin-bottom:16px;"></div><p id="alertMessage" style="font-size:16px;color:var(--text-secondary);"></p></div><div style="display:flex;gap:12px;padding:0 24px 24px;"><button class="btn btn-secondary" id="alertCancel" style="display:none;">Cancel</button><button class="btn btn-primary" id="alertConfirm">OK</button></div></div></div>
      
      <div class="modal-overlay" id="imagePickerOverlay"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Share Photo</h3><button class="modal-close" id="close-imagepicker">×</button></div><div class="list-item" id="opt-camera"><div class="item-title"><i class="fas fa-camera" style="color:var(--primary);margin-right:12px;"></i>Take Photo</div></div><div class="list-item" id="opt-gallery"><div class="item-title"><i class="fas fa-image" style="color:var(--primary);margin-right:12px;"></i>Gallery</div></div></div></div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="galleryInput" accept="image/*" multiple style="display:none;">
      
      <div class="modal-overlay" id="voiceRecOverlay"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Recording...</h3><span id="voiceRecTimer" style="font-weight:700;">0:00</span></div><div id="voiceRecWaveform" style="height:40px;display:flex;align-items:center;gap:3px;background:var(--surface-hover);padding:0 12px;border-radius:8px;margin-bottom:16px;"></div><div style="display:flex;gap:12px;padding:0 24px 24px;"><button class="btn btn-secondary" style="background:var(--danger);color:#fff;" id="voiceRecCancelBtn"><i class="fas fa-trash"></i></button><button class="btn btn-primary" id="voiceRecStopBtn"><i class="fas fa-stop"></i></button></div></div></div>
      <div class="modal-overlay" id="voicePreviewOverlay"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Voice Message</h3><button class="modal-close" id="voicePreviewClose">×</button></div><div style="display:flex;align-items:center;gap:16px;padding:0 24px 16px;"><button class="chat-send-btn" id="voicePreviewPlay" style="width:50px;height:50px;"><i class="fas fa-play"></i></button><div id="voicePreviewWaveform" style="flex:1;height:40px;display:flex;align-items:center;gap:2px;background:var(--surface-hover);border-radius:8px;padding:0 12px;"></div><span id="voicePreviewDuration" style="font-weight:600;">0:00</span></div><div style="display:flex;gap:12px;padding:0 24px 24px;"><button class="btn btn-secondary" id="voicePreviewCancel">Cancel</button><button class="btn btn-primary" id="voicePreviewSend">Send</button></div></div></div>
      
      <div class="modal-overlay" id="customToast" style="background:transparent;align-items:flex-end;padding-bottom:40px;pointer-events:none;display:none;"><div style="background:var(--text);color:#fff;padding:12px 24px;border-radius:30px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;"><span id="toastIcon"></span><span id="toastMessage"></span></div></div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Profile ═══════════ -->
  <template id="tpl-profile">
    <div class="profile-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">Profile</div>
        </div>
      </header>
      <main class="profile-layout">
        <div class="profile-header">
          <div class="avatar" id="profileAvatar">
            <span id="avatarInitial">?</span>
            <img id="avatarImage" style="display:none;">
          </div>
          <div class="profile-name" id="displayName">User</div>
          <div class="profile-username" id="displayUsername">@username</div>
        </div>
        
        <div class="flat-list" style="margin-top: 24px;">
          <div class="list-item" id="btn-enable-notifs">
            <div class="item-title">Notifications</div>
            <div class="item-subtitle" id="enableBtnLabel" style="color:var(--primary);">Enable</div>
          </div>
          <div class="list-item" id="btn-logout">
            <div class="item-title" style="color:var(--danger);">Log Out</div>
          </div>
        </div>
      </main>
      <nav class="bottom-nav">
        <div class="nav-item" data-nav="/"><i class="fas fa-comment"></i><span>Chats</span></div>
        <div class="nav-item" data-nav="/friends"><i class="fas fa-user-friends"></i><span>Friends</span></div>
        <div class="nav-item active" data-nav="/profile"><i class="fas fa-user"></i><span>Profile</span></div>
      </nav>
      
      <!-- Profile Modals -->
      <div class="modal-overlay" id="bioEditorModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Edit Bio</h3><button class="modal-close" id="close-bio">×</button></div><textarea id="bioInput" class="input-field" style="background:var(--surface-hover);border-radius:12px;width:100%;padding:16px;height:120px;resize:none;margin-bottom:16px;outline:none;" maxlength="100"></textarea><div style="display:flex;gap:12px;"><button class="btn btn-secondary" id="cancel-bio">Cancel</button><button class="btn btn-primary" id="save-bio">Save</button></div></div></div>
      <div class="modal-overlay" id="imagePickerModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Change Photo</h3><button class="modal-close" id="close-imgpicker">×</button></div><div class="list-item" id="opt-profile-camera"><div class="item-title"><i class="fas fa-camera" style="color:var(--primary);margin-right:12px;"></i>Take Photo</div></div><div class="list-item" id="opt-profile-gallery"><div class="item-title"><i class="fas fa-image" style="color:var(--primary);margin-right:12px;"></i>Gallery</div></div></div></div>
      <div class="modal-overlay" id="notificationsModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Notifications</h3><button class="modal-close" id="close-notifs-profile">×</button></div><div class="tabs"><button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">Requests</button><button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">Calls</button></div><div class="tab-content active" id="notifMainContent"><div id="notificationsList"></div></div><div class="tab-content" id="notifCallsContent"><div id="callHistoryList"></div></div></div></div>
      <div class="modal-overlay" id="guideModal"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title">Guide</h3><button class="modal-close" id="close-guide-profile">×</button></div><div class="modal-body" id="guideBody"></div></div></div>
      <div class="modal-overlay" id="customAlert"><div class="modal-panel"><div class="modal-header"><h3 class="modal-title" id="alertTitle">Alert</h3><button class="modal-close" id="close-alert-profile">×</button></div><div id="alertMessage" style="padding:24px;font-size:16px;color:var(--text-secondary);"></div></div></div>
      <input type="file" id="profileCameraInput" accept="image/*" capture="environment" style="display:none;">
      <input type="file" id="profileGalleryInput" accept="image/*" style="display:none;">
    </div>
  </template>

  <!-- ═══════════ VIEW: View Friend ═══════════ -->
  <template id="tpl-view-friend">
    <div class="view-friend-root">
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title" id="btn-back-friend" style="cursor:pointer;"><i class="fas fa-chevron-left" style="color:var(--primary);margin-right:8px;"></i> Back</div>
        </div>
      </header>
      <main id="viewMain" style="display:none;">
        <div class="profile-header">
          <div class="avatar" id="viewAvatar">
            <span id="viewAvatarInitial">?</span>
            <img id="viewAvatarImg" style="display:none;">
          </div>
          <div class="profile-name" id="viewName">User</div>
          <div class="profile-username" id="viewUsername">@username</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:12px;">
            <div class="status-dot" id="viewStatusDot" style="position:relative;width:10px;height:10px;"></div>
            <span id="viewStatusText" style="font-size:0.9rem;color:var(--text-secondary);font-weight:500;">Offline</span>
          </div>
        </div>
        
        <div class="bio-container" id="viewBioBox">No biography yet.</div>
        
        <div class="action-row">
          <button class="btn btn-secondary" id="btn-message"><i class="fas fa-comment" style="margin-right:8px;"></i>Message</button>
          <button class="btn btn-primary" id="btn-call-view"><i class="fas fa-phone" style="margin-right:8px;"></i>Call</button>
        </div>
      </main>
    </div>
  </template>

  <script type="module" src="/home/home.js"></script>
</body>
</html>
