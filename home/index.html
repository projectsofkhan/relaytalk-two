<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/home.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Dashboard ═══════════ -->
  <template id="tpl-dashboard">
    <div class="dashboard-root">

      <div class="toast-container" id="toastContainer"></div>

      <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-text">
          <span class="loading-label">Loading</span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>

      <header class="app-bar">
        <div class="app-bar-inner">
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">RelayTalk</span>
          </div>
          <div class="app-bar-actions">
            <button class="icon-btn" onclick="openSearch()" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
            <button class="icon-btn" onclick="openNotifications()" aria-label="Notifications">
              <i class="fas fa-bell"></i>
              <span class="app-bar-badge" id="notificationBadge" style="display: none;">0</span>
            </button>
          </div>
        </div>
      </header>

      <main class="page">
        <section class="greeting">
          <p class="greeting-small" id="greetingSmall">Hello</p>
          <h1 class="greeting-title" id="welcomeTitle">Friend</h1>
          <p class="greeting-sub">Welcome back to RelayTalk</p>
        </section>

        <button class="primary-action" onclick="openSearch()">
          <span class="primary-action-icon">
            <i class="fas fa-user-plus"></i>
          </span>
          <span class="primary-action-text">
            <span class="primary-action-title">Find friends</span>
            <span class="primary-action-desc">Search by username</span>
          </span>
          <span class="primary-action-chevron">
            <i class="fas fa-chevron-right"></i>
          </span>
        </button>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Friends</h2>
            <button class="text-btn" onclick="viewFriendsPage()">View all</button>
          </div>
          <div class="list" id="friendsList"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goToHome(); return false;">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(); return false;">
          <i class="fas fa-bell"></i>
          <span>Alerts</span>
          <span class="nav-badge" id="navNotificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item" onclick="viewFriendsPage(); return false;">
          <i class="fas fa-user-friends"></i>
          <span>Friends</span>
        </a>
        <a href="#" class="nav-item" onclick="goToProfile(); return false;">
          <i class="fas fa-user"></i>
          <span>You</span>
        </a>
      </nav>

      <div class="modal" id="searchModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Find people</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="search-wrap">
              <i class="fas fa-search search-svg"></i>
              <input type="text" id="searchInput" class="search-input" placeholder="Search by username" autocomplete="off" spellcheck="false">
            </div>
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>
      </div>

      <div class="modal" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Notifications</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="modal-body">
            <div class="tabs" role="tablist">
              <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                <i class="fas fa-user-plus tab-icon"></i>
                Requests
                <span class="tab-badge" id="mainTabBadge" style="display: none;">0</span>
              </button>
              <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                <i class="fas fa-comment-dots tab-icon"></i>
                Calls
                <span class="tab-badge" id="callsTabBadge" style="display: none;">0</span>
              </button>
            </div>

            <div class="tab-content active" id="notifMainContent">
              <div id="notificationsList"></div>
            </div>

            <div class="tab-content" id="notifCallsContent">
              <div id="callHistoryList"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Chats (stub) ═══════════ -->
  <template id="tpl-chats">
    <section class="app-view">
      <h1>Chats</h1>
      <p>Awaiting /pages/chats/* port.</p>
      <button class="btn-secondary" onclick="location.hash='/'" data-nav="/">← Dashboard</button>
    </section>
  </template>

  <!-- ═══════════ VIEW: Friends (stub) ═══════════ -->
  <template id="tpl-friends">
    <section class="app-view">
      <h1>Friends</h1>
      <p>Awaiting /pages/home/friends/* port.</p>
      <button class="btn-secondary" data-nav="/">← Dashboard</button>
    </section>
  </template>

  <!-- ═══════════ VIEW: Profile (stub) ═══════════ -->
  <template id="tpl-profile">
    <section class="app-view">
      <h1>Profile</h1>
      <p>Awaiting /pages/home/profile/* port.</p>
      <button class="btn-secondary" data-nav="/">← Dashboard</button>
    </section>
  </template>

  <!-- ═══════════ VIEW: View Friend (stub) ═══════════ -->
  <template id="tpl-view-friend">
    <section class="app-view">
      <h1>Friend Profile</h1>
      <p>Awaiting /pages/home/profile/view.* port.</p>
      <button class="btn-secondary" data-nav="/friends">← Friends</button>
    </section>
  </template>

  <script type="module" src="/home/home.js"></script>
</body>
</html>
