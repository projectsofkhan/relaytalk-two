<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://i.ibb.co" crossorigin>
  <link rel="dns-prefetch" href="https://i.ibb.co">
  <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
  <link rel="dns-prefetch" href="https://res.cloudinary.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/home.css">
  <link rel="stylesheet" href="/shared/styles/chats.css">
  <link rel="stylesheet" href="/shared/styles/profile.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Dashboard ═══════════ -->
  <template id="tpl-dashboard">
    <div class="dashboard-root">

      <div class="toast-container" id="toastContainer"></div>

      <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-text">
          <span class="loading-label">Loading</span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span>
        </div>
      </div>

      <header class="app-bar">
        <div class="app-bar-inner">
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">RelayTalk</span>
          </div>
          <div class="app-bar-actions">
            <button class="icon-btn" onclick="openSearch()" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
            <button class="icon-btn" onclick="openNotifications()" aria-label="Notifications">
              <i class="fas fa-bell"></i>
              <span class="app-bar-badge" id="notificationBadge" style="display: none;">0</span>
            </button>
          </div>
        </div>
      </header>

      <main class="page">
        <section class="greeting">
          <p class="greeting-small" id="greetingSmall">Hello</p>
          <h1 class="greeting-title" id="welcomeTitle">Friend</h1>
          <p class="greeting-sub">Welcome back to RelayTalk</p>
        </section>

        <button class="primary-action" onclick="openSearch()">
          <span class="primary-action-icon">
            <i class="fas fa-user-plus"></i>
          </span>
          <span class="primary-action-text">
            <span class="primary-action-title">Find friends</span>
            <span class="primary-action-desc">Search by username</span>
          </span>
          <span class="primary-action-chevron">
            <i class="fas fa-chevron-right"></i>
          </span>
        </button>

        <section class="section">
          <div class="section-head">
            <h2 class="section-title">Friends</h2>
            <button class="text-btn" onclick="viewFriendsPage()">View all</button>
          </div>
          <div class="list" id="friendsList"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-item active" onclick="goToHome(); return false;">
          <i class="fas fa-home"></i>
          <span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(); return false;">
          <i class="fas fa-bell"></i>
          <span>Alerts</span>
          <span class="nav-badge" id="navNotificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item" onclick="viewFriendsPage(); return false;">
          <i class="fas fa-user-friends"></i>
          <span>Friends</span>
        </a>
        <a href="#" class="nav-item" onclick="goToProfile(); return false;">
          <i class="fas fa-user"></i>
          <span>You</span>
        </a>
      </nav>

      <div class="modal" id="searchModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Find people</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button>
          </div>
          <div class="modal-body">
            <div class="search-wrap">
              <i class="fas fa-search search-svg"></i>
              <input type="text" id="searchInput" class="search-input" placeholder="Search by username" autocomplete="off" spellcheck="false">
            </div>
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>
      </div>

      <div class="modal" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Notifications</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button>
          </div>
          <div class="modal-body">
            <div class="tabs" role="tablist">
              <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                <i class="fas fa-user-plus tab-icon"></i> Requests
                <span class="tab-badge" id="mainTabBadge" style="display: none;">0</span>
              </button>
              <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                <i class="fas fa-comment-dots tab-icon"></i> Calls
                <span class="tab-badge" id="callsTabBadge" style="display: none;">0</span>
              </button>
            </div>
            <div class="tab-content active" id="notifMainContent"><div id="notificationsList"></div></div>
            <div class="tab-content" id="notifCallsContent"><div id="callHistoryList"></div></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Chats ═══════════ -->
  <template id="tpl-chats">
    <div class="chat-view">

      <header class="chat-header">
        <button class="back-btn" onclick="goBack()" aria-label="Back">
          <i class="fas fa-arrow-left"></i>
        </button>
        <div class="chat-user-info" id="chatHeaderProfile" role="button" tabindex="0">
          <div class="chat-user-avatar" id="chatUserAvatar">U</div>
          <div class="chat-user-details">
            <h3 id="chatUserName">User</h3>
            <div class="chat-user-status">
              <span id="statusDot" class="status-dot offline"></span>
              <span id="statusText">Offline</span>
            </div>
          </div>
        </div>
        <div class="chat-actions">
          <button class="guide-btn" id="chatGuideBtn" onclick="openGuide()" aria-label="Guide">
            <i class="fas fa-circle-question"></i>
          </button>
          <button class="call-btn" id="chatCallBtn" onclick="callCurrentFriend()" aria-label="Call friend">
            <i class="fas fa-phone"></i>
          </button>
        </div>
        <div class="top-action-bar" id="topActionBar" style="display: none;"></div>
      </header>

      <main class="main-content">
        <div class="messages-container" id="messagesContainer">
          <div class="empty-chat">
            <svg class="empty-chat-icon" viewBox="0 0 24 24">
              <path d="M20,2H4A2,2 0 0,0 2,4V22L6,18H20A2,2 0 0,0 22,16V4A2,2 0 0,0 20,2Z"/>
            </svg>
            <h3>Start the conversation</h3>
            <p>Say hello to your friend!</p>
          </div>
        </div>
      </main>

      <div class="message-input-wrapper">
        <div class="message-input-container">
          <button class="attach-btn" id="attachBtn" onclick="showImagePicker()" aria-label="Attach" tabindex="-1">
            <i class="fas fa-paperclip"></i>
          </button>
          <button class="mic-btn" id="micBtn" type="button" aria-label="Record voice message" tabindex="-1">
            <i class="fas fa-microphone"></i>
          </button>
          <textarea class="message-input" id="messageInput" placeholder="Type a message..." rows="1" style="min-height: 50px;"></textarea>
          <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send" tabindex="-1">
            <i class="fas fa-paper-plane"></i>
          </button>
        </div>
      </div>

      <div class="voice-rec-overlay" id="voiceRecOverlay" style="display: none;">
        <div class="voice-rec-panel">
          <div class="voice-rec-header">
            <span class="voice-rec-dot" aria-hidden="true"></span>
            <span class="voice-rec-label">Recording</span>
          </div>
          <div class="voice-rec-waveform" id="voiceRecWaveform"></div>
          <div class="voice-rec-timer" id="voiceRecTimer">0:00</div>
          <div class="voice-rec-hint">Tap the stop button to preview · Cancel to discard</div>
          <div class="voice-rec-actions">
            <button type="button" class="voice-rec-btn voice-rec-cancel" id="voiceRecCancelBtn" aria-label="Cancel">
              <i class="fas fa-trash"></i>
            </button>
            <button type="button" class="voice-rec-btn voice-rec-stop" id="voiceRecStopBtn" aria-label="Stop & Preview">
              <i class="fas fa-stop"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="voice-preview-overlay" id="voicePreviewOverlay" style="display: none;">
        <div class="voice-preview-panel">
          <div class="voice-preview-header">
            <h3>Send voice message?</h3>
            <button type="button" class="voice-preview-close" id="voicePreviewClose" aria-label="Close">
              <i class="fas fa-times"></i>
            </button>
          </div>
          <div class="voice-preview-body">
            <button type="button" class="voice-preview-play" id="voicePreviewPlay" aria-label="Play/Pause">
              <i class="fas fa-play"></i>
            </button>
            <div class="voice-preview-waveform" id="voicePreviewWaveform"></div>
            <div class="voice-preview-duration" id="voicePreviewDuration">0:00</div>
          </div>
          <div class="voice-preview-actions">
            <button type="button" class="btn-secondary" id="voicePreviewCancel">Cancel</button>
            <button type="button" class="btn-primary" id="voicePreviewSend">
              <i class="fas fa-paper-plane" style="margin-right: 6px;"></i> Send
            </button>
          </div>
        </div>
      </div>

      <div class="image-picker-overlay" id="imagePickerOverlay" style="display: none;">
        <div class="image-picker-container">
          <div class="image-picker-header">
            <h3>Share Images</h3>
            <button class="image-picker-close" onclick="closeImagePicker()" aria-label="Close">×</button>
          </div>
          <div class="image-picker-options">
            <button class="image-picker-option" onclick="openCamera()">
              <span class="picker-icon"><i class="fas fa-camera"></i></span> Take Photo
            </button>
            <button class="image-picker-option" onclick="openGallery()">
              <span class="picker-icon"><i class="fas fa-image"></i></span> Choose from Gallery
            </button>
          </div>
        </div>
      </div>

      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
      <input type="file" id="galleryInput" accept="image/*" multiple style="display: none;">

      <div class="modal-overlay" id="userInfoModal" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title">User Info</h3>
            <button class="modal-close" onclick="closeModal()" aria-label="Close">×</button>
          </div>
          <div class="modal-body" id="userInfoContent"></div>
        </div>
      </div>

      <div class="modal-overlay" id="guideModal" style="display: none;">
        <div class="modal-content guide-modal-content">
          <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-circle-question guide-title-icon"></i> Chat Guide</h3>
            <button class="modal-close" onclick="closeGuide()" aria-label="Close">×</button>
          </div>
          <div class="modal-body guide-body"></div>
        </div>
      </div>

      <div class="modal-overlay" id="customAlert" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title" id="alertTitle">Alert</h3>
            <button class="modal-close" onclick="document.getElementById('customAlert').style.display='none'">×</button>
          </div>
          <div class="modal-body">
            <div style="text-align: center; margin-bottom: 20px;">
              <div id="alertIcon" style="font-size: 3rem; margin-bottom: 15px;"></div>
              <p id="alertMessage">Message goes here</p>
            </div>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;">
              <button id="alertConfirm" class="btn-primary" style="min-width: 100px;">OK</button>
              <button id="alertCancel" class="btn-secondary" style="min-width: 100px; display: none;">Cancel</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="customToast" style="display: none; align-items: flex-end; justify-content: center; background: transparent; pointer-events: none;">
        <div class="toast-content" style="max-width: 320px; margin-bottom: 30px; text-align: center;">
          <div style="display: flex; align-items: center; gap: 10px;">
            <span id="toastIcon" style="font-size: 1.2rem;"></span>
            <p id="toastMessage" style="margin: 0; font-size: 0.9rem;"></p>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Friends ═══════════ -->
  <template id="tpl-friends">
    <div class="friends-root">
      <div class="toast-container" id="toastContainer"></div>
      <div class="loading-indicator" id="loadingIndicator">
        <div class="loading-text"><span class="loading-label">Loading</span><span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
      </div>

      <header class="app-bar">
        <div class="app-bar-inner">
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">Friends</span>
          </div>
          <div class="app-bar-actions"></div>
        </div>
      </header>

      <div class="search-bar-wrap">
        <div class="search-bar-inner">
          <div class="search-wrap">
            <i class="fas fa-search search-svg"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search friends..." autocomplete="off" oninput="searchFriends()">
            <button class="clear-search" id="clearSearch" onclick="clearSearch()" style="display: none;" aria-label="Clear">
              <i class="fas fa-times"></i>
            </button>
          </div>
        </div>
      </div>

      <main class="page">
        <section class="section">
          <div class="section-head">
            <h2 class="section-title">All friends</h2>
          </div>
          <div class="list" id="friendsList"></div>
        </section>
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-item" onclick="goToHome(); return false;">
          <i class="fas fa-home"></i><span>Home</span>
        </a>
        <a href="#" class="nav-item" onclick="openNotifications(event); return false;">
          <i class="fas fa-bell"></i>
          <span>Alerts</span>
          <span class="nav-badge" id="notificationBadge" style="display: none;">0</span>
        </a>
        <a href="#" class="nav-item active">
          <i class="fas fa-user-friends"></i><span>Friends</span>
        </a>
        <a href="#" class="nav-item" onclick="goToProfile(); return false;">
          <i class="fas fa-user"></i><span>You</span>
        </a>
      </nav>

      <div class="modal" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Notifications</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button>
          </div>
          <div class="modal-body">
            <div class="tabs" role="tablist">
              <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')">
                <i class="fas fa-user-plus tab-icon"></i> Requests
                <span class="tab-badge" id="mainTabBadge" style="display: none;">0</span>
              </button>
              <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')">
                <i class="fas fa-comment-dots tab-icon"></i> Calls
                <span class="tab-badge" id="callsTabBadge" style="display: none;">0</span>
              </button>
            </div>
            <div class="tab-content active" id="notifMainContent"><div id="notificationsList"></div></div>
            <div class="tab-content" id="notifCallsContent"><div id="callHistoryList"></div></div>
          </div>
        </div>
      </div>

      <div class="modal" id="searchModal" style="display:none;">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Find people</h2>
            <button class="modal-close" onclick="closeModal()" aria-label="Close"><i class="fas fa-times"></i></button>
          </div>
          <div class="modal-body">
            <div class="search-wrap">
              <i class="fas fa-search search-svg"></i>
              <input type="text" id="userSearchInput" class="search-input" placeholder="Search by username" autocomplete="off" oninput="searchUsers()">
            </div>
            <div id="searchResults" class="search-results"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Profile ═══════════ -->
  <template id="tpl-profile">
    <div class="profile-root">
      <div class="loading-overlay" id="loadingIndicator">
        <div class="loading-visual">
          <div class="loading-ring ring-1"></div>
          <div class="loading-ring ring-2"></div>
          <div class="loading-ring ring-3"></div>
          <div class="loading-core"></div>
        </div>
        <div class="loading-text">Loading<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></div>
      </div>

      <div class="loading-overlay" id="uploadLoading">
        <div class="loading-spinner"></div>
        <div class="loading-text">Uploading...</div>
      </div>

      <header class="app-bar">
        <div class="app-bar-inner">
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">Profile</span>
          </div>
          <div class="app-bar-actions">
            <button class="icon-btn" onclick="openGuide()" aria-label="Guide"><i class="fas fa-circle-question"></i></button>
          </div>
        </div>
      </header>

      <main class="profile-main">
        <section class="profile-card">
          <div class="avatar-section">
            <div class="profile-avatar" id="profileAvatar">
              <img id="avatarImage" src="" alt="Profile" style="display: none;">
              <div id="avatarInitial" class="avatar-initial">?</div>
            </div>
            <button class="change-photo-btn" onclick="openImagePicker()" aria-label="Change photo"><i class="fas fa-camera"></i></button>
          </div>

          <h2 class="user-name" id="displayName">User</h2>
          <div class="user-username" id="displayUsername">@username</div>

          <div class="bio-section">
            <div class="bio-header">
              <span class="bio-label">About / Biography</span>
              <button class="bio-edit-btn" onclick="openBioEditor()" aria-label="Edit about"><i class="fas fa-pen"></i></button>
            </div>
            <div class="bio-box" id="bioBox">
              <span class="bio-empty">Tap the pencil to write something about you (up to 100 characters)</span>
            </div>
          </div>

          <div class="profile-stats">
            <div class="stat-item"><div class="stat-value" id="friendsCount">0</div><div class="stat-label">Friends</div></div>
            <div class="stat-divider"></div>
            <div class="stat-item"><div class="stat-value" id="memberSince">—</div><div class="stat-label">Member since</div></div>
          </div>
        </section>

        <section class="guide-cta-card">
          <button class="guide-cta" onclick="openGuide()">
            <span class="guide-cta-icon"><i class="fas fa-book-open"></i></span>
            <span class="guide-cta-text">
              <span class="guide-cta-title">RelayTalk Guide</span>
              <span class="guide-cta-desc">Learn how everything works, page by page</span>
            </span>
            <span class="guide-cta-chevron"><i class="fas fa-chevron-right"></i></span>
          </button>
        </section>

        <section class="settings-card">
          <div class="settings-header">
            <div class="settings-icon"><i class="fas fa-bell"></i></div>
            <div>
              <div class="settings-title">Notifications</div>
              <div class="settings-subtitle">Control how RelayTalk reaches you</div>
            </div>
          </div>
          <div class="notify-actions">
            <button class="notify-btn" id="enableNotificationsBtn" onclick="toggleNotifications()">
              <span class="notify-btn-icon" id="enableBtnIcon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              </span>
              <span class="notify-btn-label" id="enableBtnLabel">Enable</span>
            </button>
            <button class="notify-btn" id="resetNotificationsBtn" onclick="resetNotifications()">
              <span class="notify-btn-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
              </span>
              <span class="notify-btn-label">Reset</span>
            </button>
          </div>
          <div class="notify-hint">Notifications aren't working? Reset and Re-enable now!</div>
          <button class="details-toggle" id="detailsToggleBtn" onclick="toggleDetails()">
            <span class="details-toggle-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
            <span class="details-toggle-text" id="detailsToggleLabel">Show Details</span>
            <span class="details-toggle-switch" id="detailsToggleSwitch" aria-hidden="true"></span>
          </button>
        </section>

        <section class="download-card">
          <button class="download-row" onclick="openDownloadPage()">
            <span class="download-row-icon"><i class="fas fa-download"></i></span>
            <span class="download-row-text">
              <span class="download-row-title">Download App</span>
              <span class="download-row-sub">Get the latest RelayTalk APK for Android</span>
            </span>
            <span class="download-row-chevron"><i class="fas fa-chevron-right"></i></span>
          </button>
          <button class="download-row" onclick="openPwaModal()">
            <span class="download-row-icon"><i class="fas fa-mobile-screen"></i></span>
            <span class="download-row-text">
              <span class="download-row-title">Download as PWA</span>
              <span class="download-row-sub">Install on your home screen with your browser</span>
            </span>
            <span class="download-row-chevron"><i class="fas fa-chevron-right"></i></span>
          </button>
        </section>

        <section class="actions-card">
          <button class="action-row" onclick="openImagePicker()">
            <span class="action-row-icon"><i class="fas fa-camera"></i></span>
            <span class="action-row-text">Change Photo</span>
          </button>
          <button class="action-row" onclick="goToFriends()">
            <span class="action-row-icon"><i class="fas fa-user-friends"></i></span>
            <span class="action-row-text">Find Friends</span>
          </button>
          <button class="action-row action-row-danger" onclick="logoutFromDevice()">
            <span class="action-row-icon"><i class="fas fa-right-from-bracket"></i></span>
            <span class="action-row-text">Log Out</span>
          </button>
        </section>
      </main>

      <div class="modal-overlay" id="bioEditorModal">
        <div class="modal-content">
          <div class="modal-header"><h3 class="modal-title">Edit About</h3><button class="modal-close" onclick="closeBioEditor()">×</button></div>
          <div class="modal-body">
            <textarea id="bioInput" class="bio-input" maxlength="100" rows="4" placeholder="Write something about yourself..."></textarea>
            <div class="bio-counter"><span id="bioCharCount">0</span> / 100</div>
            <div class="modal-actions">
              <button class="btn-secondary" onclick="closeBioEditor()">Cancel</button>
              <button class="btn-primary" onclick="saveBio()">Save</button>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="detailsInfoModal">
        <div class="modal-content">
          <div class="modal-header"><h3 class="modal-title" id="detailsInfoTitle">Notification Details</h3><button class="modal-close" onclick="closeDetailsInfo()">×</button></div>
          <div class="modal-body" id="detailsInfoBody"></div>
          <div class="modal-body modal-body-actions"><button class="btn-primary modal-full-btn" onclick="confirmDetailsToggle()">Got it</button></div>
        </div>
      </div>

      <div class="modal-overlay" id="imagePickerModal">
        <div class="modal-content">
          <div class="modal-header"><h3 class="modal-title">Change Photo</h3><button class="modal-close" onclick="closeModal()">×</button></div>
          <div class="modal-body">
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelect(event)">
            <div class="picker-option" onclick="uploadFromCamera()"><span class="picker-option-icon"><i class="fas fa-camera"></i></span><span class="picker-option-text">Take Photo</span></div>
            <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">
            <div class="picker-option" onclick="uploadFromGallery()"><span class="picker-option-icon"><i class="fas fa-image"></i></span><span class="picker-option-text">Choose from Gallery</span></div>
            <div class="picker-option picker-option-danger" onclick="removeAvatar()"><span class="picker-option-icon"><i class="fas fa-trash"></i></span><span class="picker-option-text">Remove Current Photo</span></div>
          </div>
        </div>
      </div>

      <div class="modal-overlay" id="pwaModal">
        <div class="modal-content">
          <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-mobile-screen" style="color:var(--primary);"></i> Install as PWA</h3>
            <button class="modal-close" onclick="closePwaModal()">×</button>
          </div>
          <div class="pwa-modal-body">
            <div class="pwa-section">
              <div class="pwa-section-title"><i class="fas fa-circle-info"></i>What is a PWA?</div>
              <p style="color:var(--text-2);font-size:0.88rem;line-height:1.6;margin:0;">A <strong>Progressive Web App (PWA)</strong> is an app that runs directly in your browser and installs onto your home screen — just like a native app.</p>
            </div>
            <div class="pwa-section">
              <div class="pwa-section-title"><i class="fab fa-android"></i>Install on Android (Chrome)</div>
              <ul class="pwa-steps">
                <li><span class="pwa-num">1</span><span>Open <strong>relaytalk.vercel.app</strong> in Chrome.</span></li>
                <li><span class="pwa-num">2</span><span>Tap the <strong>three dots</strong> at the top right.</span></li>
                <li><span class="pwa-num">3</span><span>Tap <strong>Install app</strong> or <strong>Add to Home screen</strong>.</span></li>
              </ul>
            </div>
            <div class="pwa-section">
              <div class="pwa-section-title"><i class="fab fa-apple"></i>Install on iPhone (Safari)</div>
              <ul class="pwa-steps">
                <li><span class="pwa-num">1</span><span>Open <strong>relaytalk.vercel.app</strong> in Safari.</span></li>
                <li><span class="pwa-num">2</span><span>Tap the <strong>Share</strong> icon.</span></li>
                <li><span class="pwa-num">3</span><span>Scroll and tap <strong>Add to Home Screen</strong>.</span></li>
              </ul>
            </div>
            <div class="modal-actions" style="margin-top:16px;">
              <a class="btn-primary modal-full-btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none;" href="https://relaytalk.vercel.app/" target="_blank" rel="noopener">Open RelayTalk</a>
            </div>
          </div>
        </div>
      </div>

      <div class="modal" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-head">
            <h2 class="modal-title">Notifications</h2>
            <button class="modal-close" onclick="closeNotifications()"><i class="fas fa-times"></i></button>
          </div>
          <div class="modal-body">
            <div class="tabs" role="tablist">
              <button class="tab active" id="notifTabMain" onclick="switchNotifTab('main')"><i class="fas fa-user-plus tab-icon"></i>Requests<span class="tab-badge" id="mainTabBadge" style="display:none;">0</span></button>
              <button class="tab" id="notifTabCalls" onclick="switchNotifTab('calls')"><i class="fas fa-comment-dots tab-icon"></i>Calls<span class="tab-badge" id="callsTabBadge" style="display:none;">0</span></button>
            </div>
            <div class="tab-content active" id="notifMainContent"><div id="notificationsList"></div></div>
            <div class="tab-content" id="notifCallsContent"><div id="callHistoryList"></div></div>
          </div>
        </div>
      </div>

      <div class="modal-overlay guide-modal" id="guideModal">
        <div class="modal-content guide-content">
          <div class="modal-header">
            <h3 class="modal-title"><i class="fas fa-book-open guide-title-icon"></i> RelayTalk Guide</h3>
            <button class="modal-close" onclick="closeGuide()">×</button>
          </div>
          <div class="guide-nav">
            <button class="guide-nav-btn active" data-guide="home" onclick="showGuideSection('home', this)"><i class="fas fa-home"></i> Home</button>
            <button class="guide-nav-btn" data-guide="chats" onclick="showGuideSection('chats', this)"><i class="fas fa-comment-dots"></i> Chats</button>
            <button class="guide-nav-btn" data-guide="friends" onclick="showGuideSection('friends', this)"><i class="fas fa-user-friends"></i> Friends</button>
            <button class="guide-nav-btn" data-guide="profile" onclick="showGuideSection('profile', this)"><i class="fas fa-user"></i> Profiles</button>
            <button class="guide-nav-btn" data-guide="view" onclick="showGuideSection('view', this)"><i class="fas fa-id-badge"></i> Friend's Profile</button>
            <button class="guide-nav-btn" data-guide="others" onclick="showGuideSection('others', this)"><i class="fas fa-ellipsis-h"></i> Others</button>
          </div>
          <div class="guide-body" id="guideBody"></div>
        </div>
      </div>

      <div id="toastContainer" class="toast-container"></div>

      <nav class="bottom-nav">
        <a href="#" class="nav-item" onclick="goToHome(); return false;"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item" onclick="openNotifications(event); return false;"><i class="fas fa-bell"></i><span>Alerts</span><span class="nav-badge" id="notificationBadge" style="display:none;">0</span></a>
        <a href="#" class="nav-item" onclick="goToFriends(); return false;"><i class="fas fa-user-friends"></i><span>Friends</span></a>
        <a href="#" class="nav-item active"><i class="fas fa-user"></i><span>You</span></a>
      </nav>
    </div>
  </template>

  <!-- ═══════════ VIEW: View Friend ═══════════ -->
  <template id="tpl-view-friend">
    <div class="view-root">
      <div class="view-fallback" id="fallbackScreen" style="display:none;">
        <div class="fallback-card">
          <div class="fallback-emoji">🔎</div>
          <h2 class="fallback-title">Account not found</h2>
          <p class="fallback-message">This account does not exist or may have been removed.</p>
          <div class="fallback-actions">
            <a href="#" onclick="closeView();return false;" class="fallback-btn primary">Go back</a>
          </div>
        </div>
      </div>

      <header class="app-bar">
        <div class="app-bar-inner">
          <button class="back-btn" onclick="closeView()" aria-label="Back"><i class="fas fa-arrow-left"></i></button>
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">Friend's Profile</span>
          </div>
        </div>
      </header>

      <main class="view-main" id="viewMain" style="display:none;">
        <div class="view-avatar-wrap">
          <div class="view-avatar" id="viewAvatar">
            <span class="view-avatar-initial" id="viewAvatarInitial">?</span>
            <img id="viewAvatarImg" src="" alt="" style="display:none;">
          </div>
        </div>

        <h1 class="view-name" id="viewName">User</h1>
        <div class="view-username" id="viewUsername">@username</div>

        <div class="view-status-pill" id="viewStatusPill">
          <span class="view-status-dot" id="viewStatusDot"></span>
          <span class="view-status-text" id="viewStatusText">Offline</span>
        </div>

        <div class="view-actions">
          <button class="view-action-btn view-action-message" onclick="openChat()"><i class="fas fa-comment-dots"></i><span>Message</span></button>
          <button class="view-action-btn view-action-call" onclick="startCallFromView()"><i class="fas fa-phone"></i><span>Call</span></button>
        </div>

        <div class="view-bio-section">
          <div class="view-bio-label">Biography</div>
          <div class="view-bio-box" id="viewBioBox">
            <span class="view-bio-empty">No biography yet.</span>
          </div>
        </div>

        <div class="view-friends-since" id="viewFriendsSince"></div>
      </main>

      <div class="view-toast" id="viewToast" style="display:none;">
        <span id="viewToastIcon">✅</span>
        <span id="viewToastText">Message</span>
      </div>
    </div>
  </template>

  <script type="module" src="/home/home.js"></script>
</body>
</html>
