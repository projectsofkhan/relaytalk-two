<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="/shared/styles/base.css">
  <link rel="stylesheet" href="/shared/styles/home.css">
  <link rel="stylesheet" href="/shared/styles/chats.css">
  <link rel="stylesheet" href="/shared/styles/profile.css">
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Dashboard ═══════════ -->
  <template id="tpl-dashboard">
    <div class="dashboard-root">
      <header class="app-bar">
        <div class="app-bar-inner">
          <div class="app-bar-brand">
            <img src="/relay.png" alt="RelayTalk" class="brand-logo-img">
            <span class="brand-name">RelayTalk</span>
          </div>
        </div>
      </header>
      <main class="page">
        <h1 style="padding: 20px;">Dashboard Loaded!</h1>
      </main>
    </div>
  </template>

  <!-- ═══════════ VIEW: Chats ═══════════ -->
  <template id="tpl-chats">
    <div class="chat-view">
       <h1 style="padding: 20px;">Chats Loaded!</h1>
    </div>
  </template>

  <!-- ═══════════ VIEW: Friends ═══════════ -->
  <template id="tpl-friends">
    <div class="friends-root">
       <h1 style="padding: 20px;">Friends Loaded!</h1>
    </div>
  </template>

  <!-- ═══════════ VIEW: Profile ═══════════ -->
  <template id="tpl-profile">
    <div class="profile-root">
       <h1 style="padding: 20px;">Profile Loaded!</h1>
    </div>
  </template>

  <!-- ═══════════ VIEW: View Friend ═══════════ -->
  <template id="tpl-view-friend">
    <div class="view-root">
       <h1 style="padding: 20px;">Friend Profile Loaded!</h1>
    </div>
  </template>

  <script type="module" src="/home/home.js"></script>
</body>
</html>
