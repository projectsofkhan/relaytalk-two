<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RelayTalk</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/relay.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/relay.png">
  <link rel="manifest" href="/manifest.json">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* ============================================================
       RELAYTALK ULTRA-MINIMAL UI
       No shadows. No gradients. Flat. Perfectly aligned.
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-hover: #f2f2f7;
      --primary: #007aff; /* iOS Blue */
      --text: #000000;
      --text-secondary: #8e8e93;
      --border: #e5e5ea;
      --danger: #ff3b30;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-pill: 999px;
      --font: 'Inter', -apple-system, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.4;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--primary); text-decoration: none; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    img { display: block; max-width: 100%; }
    
    .view-outlet { display: block; width: 100%; min-height: 100vh; }
    
    .loading-indicator { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .loading-spinner { width: 30px; height: 30px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ============================================================
       GLOBAL LAYOUT
       ============================================================ */
    .app-header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
    .app-header-inner { max-width: 680px; margin: 0 auto; height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
    .app-actions { display: flex; gap: 16px; }
    .app-actions button { font-size: 18px; color: var(--primary); }

    .page-container { max-width: 680px; margin: 0 auto; padding: 16px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin: 24px 0 8px 16px; }
    
    /* FLAT LISTS (No cards, just borders) */
    .flat-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; }
    
    .list-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); transition: background 0.1s; cursor: pointer; }
    .list-item:last-child { border-bottom: none; }
    .list-item:active { background: var(--surface-hover); }
    
    .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-hover); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; flex-shrink: 0; overflow: hidden; position: relative; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    .status-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--surface); background: var(--text-secondary); }
    .status-dot.online { background: #34c759; }
    
    .item-content { flex: 1; min-width: 0; }
    .item-title { font-weight: 600; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-subtitle { font-size: 14px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .item-action { color: var(--primary); font-size: 15px; font-weight: 500; }

    /* BUTTONS */
    .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: var(--radius-md); font-size: 16px; font-weight: 600; width: 100%; transition: opacity 0.2s; }
    .btn:active { opacity: 0.7; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-danger { background: #ff3b30; color: #fff; }
    
    /* INPUTS */
    .input-group { display: flex; align-items: center; background: var(--surface-hover); border-radius: var(--radius-md); padding: 0 12px; margin-bottom: 16px; }
    .input-group i { color: var(--text-secondary); font-size: 16px; }
    .input-field { flex: 1; border: none; background: transparent; padding: 14px 12px; font-size: 16px; color: var(--text); outline: none; }

    /* BOTTOM NAV (Simple text, not giant icons) */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom)); z-index: 100; max-width: 680px; margin: 0 auto; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--text-secondary); font-size: 11px; font-weight: 500; padding: 4px 16px; }
    .nav-btn i { font-size: 22px; margin-bottom: 2px; }
    .nav-btn.active { color: var(--primary); }

    /* ============================================================
       CHAT VIEW (iMessage Style)
       ============================================================ */
    .chat-layout { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
    .chat-top { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); z-index: 10; }
    .chat-top .back { font-size: 20px; color: var(--primary); margin-right: 12px; cursor: pointer; }
    .chat-top .avatar { width: 36px; height: 36px; margin-right: 10px; }
    .chat-top-info { flex: 1; }
    .chat-top-name { font-size: 16px; font-weight: 600; }
    .chat-top-status { font-size: 13px; color: var(--text-secondary); }
    .chat-top-actions { display: flex; gap: 16px; color: var(--primary); font-size: 18px; }
    
    .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 90px; }
    
    .msg-row { display: flex; flex-direction: column; max-width: 75%; }
    .msg-row.sent { align-self: flex-end; align-items: flex-end; }
    .msg-row.received { align-self: flex-start; align-items: flex-start; }
    
    .msg-bubble { padding: 10px 16px; font-size: 16px; line-height: 1.4; border-radius: 20px; word-break: break-word; }
    .sent .msg-bubble { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
    .received .msg-bubble { background: var(--surface-hover); color: var(--text); border-bottom-left-radius: 4px; }
    .msg-time { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }

    .chat-input-area { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px; padding-bottom: max(10px, env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; max-width: 680px; margin: 0 auto; }
    .chat-input { flex: 1; background: var(--surface-hover); border: 1px solid transparent; border-radius: 20px; padding: 10px 16px; font-size: 16px; color: var(--text); outline: none; min-height: 40px; max-height: 100px; resize: none; }
    .chat-input:focus { border-color: var(--border); background: var(--surface); }
    .chat-btn { font-size: 22px; color: var(--primary); padding: 8px; cursor: pointer; }
    .chat-btn:disabled { color: var(--text-secondary); opacity: 0.5; }

    /* ============================================================
       PROFILE & VIEW FRIEND
       ============================================================ */
    .profile-header { display: flex; flex-direction: column; align-items: center; padding: 32px 16px; border-bottom: 1px solid var(--border); }
    .profile-header .avatar { width: 88px; height: 88px; font-size: 32px; margin-bottom: 16px; }
    .profile-name { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
    .profile-username { font-size: 15px; color: var(--text-secondary); margin-top: 4px; margin-bottom: 16px; }
    
    .bio-text { text-align: center; font-size: 15px; color: var(--text); padding: 16px; max-width: 400px; margin: 0 auto; line-height: 1.5; }
    
    .view-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
    
    /* MODALS */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; justify-content: center; z-index: 1000; opacity: 0; transition: opacity 0.2s; }
    .modal-overlay.visible { opacity: 1; }
    .modal-panel { background: var(--bg); width: 100%; max-width: 540px; max-height: 85vh; border-radius: 20px 20px 0 0; padding: 24px; padding-bottom: max(24px, env(safe-area-inset-bottom)); transform: translateY(20px); transition: transform 0.3s; }
    .modal-overlay.visible .modal-panel { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .modal-title { font-size: 18px; font-weight: 700; }
    .modal-close { font-size: 24px; color: var(--text-secondary); cursor: pointer; }
  </style>
</head>
<body>
  <main id="view-outlet" class="view-outlet" aria-live="polite"></main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- ═══════════ VIEW: Dashboard ═══════════ -->
  <template id="tpl-dashboard">
    <div class="dashboard-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>

      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">RelayTalk</div>
          <div class="app-actions">
            <button id="btn-search"><i class="fas fa-search"></i></button>
            <button id="btn-notifs"><i class="fas fa-bell"></i></button>
          </div>
        </div>
      </header>

      <main class="page-container">
        <div style="margin-top: 16px;">
          <h1 style="font-size: 28px; font-weight: 700; letter-spacing: -1px;" id="welcomeTitle">Hello</h1>
          <p style="color: var(--text-secondary); font-size: 15px;">Welcome back to RelayTalk</p>
        </div>

        <button class="btn btn-primary" style="margin-top: 24px;" id="btn-find-friends">
          Find Friends
        </button>

        <div class="section-title">Friends</div>
        <div class="flat-list" id="friendsList">
          <!-- JS renders list here -->
        </div>
      </main>

      <nav class="bottom-nav">
        <a href="#" class="nav-btn active" data-nav="/"><i class="fas fa-comment"></i>Chats</a>
        <a href="#" class="nav-btn" data-nav="/friends"><i class="fas fa-user-friends"></i>Friends</a>
        <a href="#" class="nav-btn" data-nav="/profile"><i class="fas fa-user"></i>Profile</a>
      </nav>

      <!-- Modals -->
      <div class="modal-overlay" id="searchModal">
        <div class="modal-panel">
          <div class="modal-header"><div class="modal-title">Find People</div><button class="modal-close" id="close-search">×</button></div>
          <div class="input-group"><i class="fas fa-search"></i><input type="text" id="searchInput" class="input-field" placeholder="Search by username"></div>
          <div id="searchResults" style="margin-top: 16px;"></div>
        </div>
      </div>

      <div class="modal-overlay" id="notificationsModal">
        <div class="modal-panel">
          <div class="modal-header"><div class="modal-title">Notifications</div><button class="modal-close" id="close-notifs">×</button></div>
          <div id="notificationsList"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Friends ═══════════ -->
  <template id="tpl-friends">
    <div class="friends-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">Friends</div>
        </div>
      </header>
      <main class="page-container">
        <div class="input-group" style="margin-top: 16px;">
          <i class="fas fa-search"></i>
          <input type="text" id="searchFriendsInput" class="input-field" placeholder="Search friends...">
        </div>
        <div class="flat-list" id="friendsList"></div>
      </main>
      <nav class="bottom-nav">
        <a href="#" class="nav-btn" data-nav="/"><i class="fas fa-comment"></i>Chats</a>
        <a href="#" class="nav-btn active" data-nav="/friends"><i class="fas fa-user-friends"></i>Friends</a>
        <a href="#" class="nav-btn" data-nav="/profile"><i class="fas fa-user"></i>Profile</a>
      </nav>
    </div>
  </template>

  <!-- ═══════════ VIEW: Chats ═══════════ -->
  <template id="tpl-chats">
    <div class="chat-layout">
      <header class="chat-top">
        <div class="back" id="btn-back"><i class="fas fa-chevron-left"></i></div>
        <div class="avatar" id="chatUserAvatar">U</div>
        <div class="chat-top-info">
          <div class="chat-top-name" id="chatUserName">User</div>
          <div class="chat-top-status" id="statusText">Offline</div>
        </div>
        <div class="chat-top-actions">
          <i class="fas fa-phone" id="btn-call"></i>
        </div>
      </header>

      <main class="chat-messages" id="messagesContainer">
        <!-- Messages render here -->
      </main>

      <div class="chat-input-area">
        <i class="fas fa-camera chat-btn" id="btn-image" style="font-size: 20px;"></i>
        <textarea class="chat-input" id="messageInput" placeholder="Message..." rows="1"></textarea>
        <i class="fas fa-paper-plane chat-btn" id="sendBtn"></i>
      </div>
    </div>
  </template>

  <!-- ═══════════ VIEW: Profile ═══════════ -->
  <template id="tpl-profile">
    <div class="profile-root">
      <div class="loading-indicator" id="loadingIndicator"><div class="loading-spinner"></div></div>
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title">Profile</div>
        </div>
      </header>
      <main class="page-container" style="padding: 0;">
        <div class="profile-header">
          <div class="avatar" id="profileAvatar">
            <span id="avatarInitial">?</span>
            <img id="avatarImage" style="display:none;">
          </div>
          <div class="profile-name" id="displayName">User</div>
          <div class="profile-username" id="displayUsername">@username</div>
        </div>
        
        <div class="flat-list" style="margin: 16px;">
          <div class="list-item" id="btn-notifications">
            <div class="item-content"><div class="item-title">Notifications</div></div>
            <div class="item-action" id="enableBtnLabel">Enable</div>
          </div>
          <div class="list-item" id="btn-logout">
            <div class="item-content"><div class="item-title" style="color: var(--danger);">Log Out</div></div>
          </div>
        </div>
      </main>
      <nav class="bottom-nav">
        <a href="#" class="nav-btn" data-nav="/"><i class="fas fa-comment"></i>Chats</a>
        <a href="#" class="nav-btn" data-nav="/friends"><i class="fas fa-user-friends"></i>Friends</a>
        <a href="#" class="nav-btn active" data-nav="/profile"><i class="fas fa-user"></i>Profile</a>
      </nav>
    </div>
  </template>

  <!-- ═══════════ VIEW: View Friend ═══════════ -->
  <template id="tpl-view-friend">
    <div class="view-root">
      <header class="app-header">
        <div class="app-header-inner">
          <div class="app-title" style="cursor:pointer;" id="btn-back-friend"><i class="fas fa-chevron-left" style="color:var(--primary);"></i> Back</div>
        </div>
      </header>
      <main class="page-container" id="viewMain" style="display:none; padding:0;">
        <div class="profile-header">
          <div class="avatar" id="viewAvatar">
            <span id="viewAvatarInitial">?</span>
            <img id="viewAvatarImg" style="display:none;">
          </div>
          <div class="profile-name" id="viewName">User</div>
          <div class="profile-username" id="viewUsername">@username</div>
          <div class="status-dot online" id="viewStatusDot" style="position:relative; display:inline-block; margin-bottom:16px;"></div>
          <span id="viewStatusText" style="font-size: 14px; color: var(--text-secondary);">Online</span>
        </div>
        
        <div class="bio-text" id="viewBioBox">No biography yet.</div>
        
        <div class="view-actions">
          <button class="btn" style="background:var(--surface-hover); color:var(--text);" id="btn-message"><i class="fas fa-comment" style="margin-right:8px;"></i>Message</button>
          <button class="btn btn-primary" id="btn-call-view"><i class="fas fa-phone" style="margin-right:8px;"></i>Call</button>
        </div>
      </main>
    </div>
  </template>

  <script type="module" src="/home/home.js"></script>
</body>
</html>
